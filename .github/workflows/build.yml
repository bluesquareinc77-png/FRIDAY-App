name: Build F.R.I.D.A.Y. APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare F.R.I.D.A.Y. APK
        run: |
          mkdir -p release_out
          cp app/build/outputs/apk/debug/*.apk release_out/F.R.I.D.A.Y.apk

      - name: Upload F.R.I.D.A.Y. APK
        uses: actions/upload-artifact@v4
        with:
          name: F.R.I.D.A.Y.apk
          path: release_out/F.R.I.D.A.Y.apk
